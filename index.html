<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APKZone</title><link rel="stylesheet" href="style.css"></head><body><header><h1>APKZone</h1><p>Discover Android apps</p><nav><a href="#apps">Apps</a> <a href="#admin">Admin</a></nav></header><main><section><input id="search" placeholder="Search apps..." aria-label="Search apps"></section><section id="apps"><h2>Latest apps</h2><div id="app-list">Loading…</div></section><section id="admin"><h2>Admin</h2><p id="status">Sign in with your authorized admin account.</p><form id="login"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><button id="logout" hidden>Sign out</button><form id="add-app" hidden><input id="app-name" placeholder="App name" required><input id="app-version" placeholder="Version"><textarea id="description" placeholder="Description"></textarea><input id="link" type="url" placeholder="External download URL (optional)"><label>Upload APK <input id="file" type="file" accept=".apk"></label><button>Add app</button></form></section></main><footer>Publish only apps you have permission to distribute.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
